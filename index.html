<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Invitación</title>
    <link rel="stylesheet" href="./assets/css/variables.css" />
    <link rel="stylesheet" href="./assets/css/layout.css" />
    <link rel="stylesheet" href="./assets/css/style.css" />
    <link rel="stylesheet" href="./assets/css/responsive.css" />
  </head>

  <body>
    <!-- Todos los textos se editan en contenido.json; aquí solo van variables -->
    <template id="plantilla">
      <!-- 1. PUERTAS DE CANTINA DE BIENVENIDA (madera coñac, detalles rosa y cromo) -->
      <div class="cantina-screen" id="cantinaScreen">
        <!-- Dibujos reutilizables: puerta, voluta, estrella y herradura -->
        <svg class="cantina-defs" aria-hidden="true">
          <defs>
            <linearGradient id="cromoPuerta" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#ffffff" />
              <stop offset="0.3" stop-color="#c4c7cf" />
              <stop offset="0.5" stop-color="#f7f8fa" />
              <stop offset="0.72" stop-color="#9da1ab" />
              <stop offset="1" stop-color="#e9eaee" />
            </linearGradient>
            <path
              id="voluta"
              d="M100,98 L95,106 L100,114 L105,106 Z M100,114 C92,104 80,102 73,109 C66,116 72,126 80,123 C86,121 85,113 79,114 M100,114 C108,104 120,102 127,109 C134,116 128,126 120,123 C114,121 115,113 121,114 M100,114 C94,124 82,130 66,126 M100,114 C106,124 118,130 134,126"
            />
            <polygon
              id="estrellaRosa"
              points="0,-16 4.1,-5.7 15.2,-4.9 6.7,2.2 9.4,12.9 0,7 -9.4,12.9 -6.7,2.2 -15.2,-4.9 -4.1,-5.7"
            />
          </defs>
          <symbol
            id="puertaVaquera"
            viewBox="0 0 200 500"
            preserveAspectRatio="none"
          >
            <defs>
              <clipPath id="formaPuerta">
                <path
                  d="M0,46 C30,14 80,8 118,26 C150,42 172,74 200,70 L200,440 C150,452 80,470 0,488 Z"
                />
              </clipPath>
              <linearGradient id="maderaPuerta" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" style="stop-color: var(--madera-media)" />
                <stop offset="1" style="stop-color: var(--madera-oscura)" />
              </linearGradient>
              <linearGradient id="tablilla" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" style="stop-color: var(--madera-clara)" />
                <stop offset="0.6" style="stop-color: var(--madera-media)" />
                <stop offset="1" style="stop-color: var(--madera-oscura)" />
              </linearGradient>
              <filter id="vetaMadera" x="0" y="0" width="100%" height="100%">
                <feTurbulence
                  type="fractalNoise"
                  baseFrequency="0.035 0.0035"
                  numOctaves="4"
                  seed="7"
                />
                <feColorMatrix
                  values="0 0 0 0 0.12  0 0 0 0 0.07  0 0 0 0 0.04  1.2 0 0 0 -0.4"
                />
              </filter>
            </defs>
            <g clip-path="url(#formaPuerta)">
              <rect width="200" height="500" fill="url(#maderaPuerta)" />
              <rect
                class="veta"
                width="200"
                height="500"
                filter="url(#vetaMadera)"
              />
              <!-- panel tallado de arriba -->
              <rect
                class="tabla-panel"
                x="30"
                y="80"
                width="140"
                height="66"
                rx="8"
              />
              <use href="#voluta" class="voluta" />
              <!-- persianas con estrella rosa -->
              <rect
                class="tabla-panel"
                x="30"
                y="162"
                width="140"
                height="170"
                rx="4"
              />
              <rect
                x="38"
                y="170"
                width="124"
                height="11"
                fill="url(#tablilla)"
              />
              <rect
                x="38"
                y="186"
                width="124"
                height="11"
                fill="url(#tablilla)"
              />
              <rect
                x="38"
                y="202"
                width="124"
                height="11"
                fill="url(#tablilla)"
              />
              <rect
                x="38"
                y="218"
                width="124"
                height="11"
                fill="url(#tablilla)"
              />
              <rect
                x="38"
                y="234"
                width="124"
                height="11"
                fill="url(#tablilla)"
              />
              <rect
                x="38"
                y="250"
                width="124"
                height="11"
                fill="url(#tablilla)"
              />
              <rect
                x="38"
                y="266"
                width="124"
                height="11"
                fill="url(#tablilla)"
              />
              <rect
                x="38"
                y="282"
                width="124"
                height="11"
                fill="url(#tablilla)"
              />
              <rect
                x="38"
                y="298"
                width="124"
                height="11"
                fill="url(#tablilla)"
              />
              <rect
                x="38"
                y="314"
                width="124"
                height="11"
                fill="url(#tablilla)"
              />
              <use href="#estrellaRosa" class="estrella-rosa" x="100" y="248" />
              <!-- panel tallado de abajo -->
              <rect
                class="tabla-panel"
                x="30"
                y="348"
                width="140"
                height="74"
                rx="8"
              />
              <use href="#voluta" class="voluta" y="273" />
              <!-- bisagras cromadas -->
              <rect
                class="laton"
                x="-4"
                y="100"
                width="20"
                height="30"
                rx="3"
              />
              <rect
                class="laton"
                x="-4"
                y="390"
                width="20"
                height="30"
                rx="3"
              />
            </g>
            <path
              class="contorno"
              d="M0,46 C30,14 80,8 118,26 C150,42 172,74 200,70 L200,440 C150,452 80,470 0,488 Z"
            />
          </symbol>
          <symbol id="herradura" viewBox="0 0 40 46">
            <path
              class="herradura-borde"
              d="M8,4 C1,20 4,40 20,42 C36,40 39,20 32,4"
            />
            <path
              class="herradura-rosa"
              d="M8,4 C1,20 4,40 20,42 C36,40 39,20 32,4"
            />
          </symbol>
        </svg>

        <!-- Destellos cromados en las esquinas del cartel -->
        <span class="esquina q1" aria-hidden="true">✦</span>
        <span class="esquina q2" aria-hidden="true">✦</span>
        <span class="esquina q3" aria-hidden="true">✦</span>
        <span class="esquina q4" aria-hidden="true">✦</span>

        <!-- Letrero en arco -->
        <div class="cantina-letrero">
          <svg class="cantina-arco" viewBox="0 0 340 90">
            <path id="arcoLetrero" d="M 8 86 Q 170 0 332 86" fill="none" />
            <text text-anchor="middle">
              <textPath href="#arcoLetrero" startOffset="50%">
                {{puertas.letrero}}
              </textPath>
            </text>
          </svg>
          <p class="cantina-adorno" aria-hidden="true">✦</p>
        </div>

        <button
          class="cantina-puertas"
          id="abrirPuertas"
          aria-label="{{puertas.botonAria}}"
        >
          <!-- Poste izquierdo con soga y herradura -->
          <span class="poste poste-izq" aria-hidden="true">
            <svg class="soga" viewBox="0 0 30 300" preserveAspectRatio="none">
              <path
                d="M15,0 C30,40 0,80 15,120 C30,160 0,200 15,240 C30,270 5,290 15,300"
              />
            </svg>
            <svg class="herradura"><use href="#herradura" /></svg>
          </span>
          <span class="puerta puerta-izq">
            <svg class="puerta-svg">
              <use href="#puertaVaquera" width="100%" height="100%" />
            </svg>
          </span>
          <span class="puerta puerta-der">
            <svg class="puerta-svg espejo">
              <use href="#puertaVaquera" width="100%" height="100%" />
            </svg>
          </span>
          <!-- Poste derecho con soga y herradura -->
          <span class="poste poste-der" aria-hidden="true">
            <svg class="soga" viewBox="0 0 30 300" preserveAspectRatio="none">
              <path
                d="M15,0 C30,40 0,80 15,120 C30,160 0,200 15,240 C30,270 5,290 15,300"
              />
            </svg>
            <svg class="herradura"><use href="#herradura" /></svg>
          </span>
          <!-- Moño que amarra las puertas (se desata al abrir) -->
          <svg class="cantina-mono" viewBox="0 0 100 62" aria-hidden="true">
            <path
              class="mono-cinta"
              d="M46,32 L30,60 L39,57 L48,37 Z M54,32 L70,60 L61,57 L52,37 Z"
            />
            <path
              class="mono-cinta"
              d="M50,30 C30,4 4,10 10,30 C4,50 30,56 50,30 Z M50,30 C70,4 96,10 90,30 C96,50 70,56 50,30 Z"
            />
            <path
              class="mono-pliegue"
              d="M50,30 C36,17 20,17 17,28 M50,30 C64,17 80,17 83,28"
            />
            <ellipse class="mono-cinta" cx="50" cy="30" rx="7" ry="8.5" />
          </svg>
        </button>
        <p class="cantina-hint">{{puertas.instruccion}}</p>
      </div>

      <main class="content hidden" id="invitationContent">
        <!-- 2. HOME -->
        <section class="section-home">
          <!-- Texto en curva con las letras grandes de fondo -->
          <div class="home-bienvenida">
            <span class="home-xv" aria-hidden="true">
              {{portada.letrasFondo}}
            </span>
            <svg
              class="home-arco"
              viewBox="0 0 360 100"
              role="img"
              aria-label="{{portada.bienvenida}}"
            >
              <path
                id="arcoBienvenida"
                d="M 14 96 Q 180 0 346 96"
                fill="none"
              />
              <text text-anchor="middle">
                <textPath href="#arcoBienvenida" startOffset="50%">
                  {{portada.bienvenida}}
                </textPath>
              </text>
            </svg>
          </div>
          <img
            class="home-img"
            src="{{portada.foto}}"
            alt="{{portada.fotoAlt}}"
          />
          <!-- Marco tipo sticker con esquinas recortadas (marco-sombra le da la sombra) -->
          <div class="marco-sombra">
            <div class="home-title marco">
              <p class="home-evento">{{portada.evento}}</p>
              <h1 class="home-nombre">{{portada.nombre}}</h1>
            </div>
          </div>
        </section>

        <!-- 3. MÚSICA -->
        {{#musica}}
        <section class="section-music">
          <div class="music-card" id="musicCard">
            <!-- Espectro de audio: las barras las crea main.js y se mueven con CSS -->
            <div class="espectro" aria-hidden="true"></div>
            <button
              class="play-button"
              id="playPauseBtn"
              aria-label="{{musica.botonAria}}"
            >
              ▶
            </button>
            <div class="espectro" aria-hidden="true"></div>

            <audio id="music" loop src="{{musica.archivo}}"></audio>
          </div>
          <p class="music-hint">{{musica.instruccion}}</p>
        </section>
        {{/musica}}

        <!-- 4. PALABRAS / DEDICATORIA -->
        {{#dedicatoria}}
        <section class="section-palabras">
          <p>{{dedicatoria.texto}}</p>
          <small>{{dedicatoria.firma}}</small>
        </section>
        {{/dedicatoria}}

        <!-- SE BUSCA: cartel de invitación con placa de sheriff -->
        {{#seBusca}}
        <section class="section-sebusca">
          <div class="cartel">
            <div class="cartel-papel">
              <h2 class="cartel-titulo">{{seBusca.titulo}}</h2>
              <p class="cartel-subtitulo">{{seBusca.subtitulo}}</p>
              <div class="cartel-marco">
                <!-- Dibujo: letras XV grandes -->
                <div class="cartel-dibujo" aria-hidden="true">
                  <span>{{seBusca.letras}}</span>
                </div>
                <span class="cartel-estrella e1" aria-hidden="true">★</span>
                <span class="cartel-estrella e2" aria-hidden="true">★</span>
                <span class="cartel-estrella e3" aria-hidden="true">★</span>
                <span class="cartel-estrella e4" aria-hidden="true">★</span>
              </div>
              <p class="cartel-llamado">{{seBusca.llamado}}</p>
              <p class="cartel-texto">{{seBusca.texto}}</p>
              <p class="cartel-firma">{{seBusca.firma}}</p>
              <p class="cartel-recompensa">{{seBusca.recompensaTitulo}}</p>
              <p class="cartel-cantidad">{{seBusca.cantidad}}</p>
              <p class="cartel-detalle">{{seBusca.detalle}}</p>
            </div>

            <!-- Placa de sheriff rosa clavada en la esquina del cartel -->
            <svg class="placa-sheriff" viewBox="0 0 200 200" aria-hidden="true">
              <g class="placa-puntas">
                <circle cx="100" cy="14" r="10" />
                <circle cx="174.5" cy="57" r="10" />
                <circle cx="174.5" cy="143" r="10" />
                <circle cx="100" cy="186" r="10" />
                <circle cx="25.5" cy="143" r="10" />
                <circle cx="25.5" cy="57" r="10" />
              </g>
              <polygon
                class="placa-estrella"
                points="100,20 123,60.2 169.3,60 146,100 169.3,140 123,139.8 100,180 77,139.8 30.7,140 54,100 30.7,60 77,60.2"
              />
              <polygon
                class="placa-costura"
                transform="translate(100 100) scale(0.84) translate(-100 -100)"
                points="100,20 123,60.2 169.3,60 146,100 169.3,140 123,139.8 100,180 77,139.8 30.7,140 54,100 30.7,60 77,60.2"
              />
              <text class="placa-arriba" x="100" y="80" text-anchor="middle">
                {{seBusca.placaArriba}}
              </text>
              <text class="placa-texto" x="100" y="120" text-anchor="middle">
                {{seBusca.placa}}
              </text>
              <text class="placa-abajo" x="100" y="138" text-anchor="middle">
                ★
              </text>
            </svg>
          </div>
        </section>
        {{/seBusca}}

        <!-- 5 y 6. INFO + CUENTA REGRESIVA: un solo fondo de piel de vaca para que fluyan juntas -->
        <div class="rancho">
          <!-- 5. INFO FORMAL (grabada en la piel) -->
          {{#invitacion}}
          <section class="section-info">
            <!-- Tronco que divide con la sección de arriba -->
            <div class="tronco" aria-hidden="true"></div>
            <!-- Letrero de madera colgando del tronco con dos sogas -->
            <div class="letrero">
              <span class="letrero-mono izq" aria-hidden="true"></span>
              <span class="letrero-mono der" aria-hidden="true"></span>
              <h2 class="letrero-tabla">{{invitacion.titulo}}</h2>
              <img
                class="letrero-sombrero"
                src="./assets/img/sombrero.png"
                alt=""
              />
            </div>

            <div class="grabado">
              {{#invitacion.familia}}
              <div class="info-content">
                <b>{{titulo}}</b>
                <ul>
                  {{#nombres}}
                  <li>{{.}}</li>
                  {{/nombres}}
                </ul>
              </div>
              {{/invitacion.familia}}

              <div class="grabado-separador" aria-hidden="true">★</div>

              <div class="date-box">
                <span>{{invitacion.fecha.dia}}</span>
                <strong>{{invitacion.fecha.fecha}}</strong>
                <span>{{invitacion.fecha.hora}}</span>
              </div>
            </div>
          </section>
          {{/invitacion}}

          <!-- 6. CUENTA REGRESIVA como reloj de cantina (la fecha sale de evento.inicio) -->
          {{#cuentaRegresiva}}
          <section class="section-timer">
            <h2>{{cuentaRegresiva.titulo}}</h2>
            <!-- Reloj horizontal: carátula a la izquierda y placa con la cuenta a la derecha -->
            <div class="reloj">
              <div class="reloj-caja">
                <span class="reloj-mono" aria-hidden="true"></span>
                <!-- Carátula: marca la hora real -->
                <div class="reloj-caratula" aria-hidden="true">
                  <span class="reloj-corazon">♥</span>
                  <span class="manecilla horaria"></span>
                  <span class="manecilla minutero"></span>
                  <span class="manecilla segundero"></span>
                </div>
                <!-- Placa de latón con la cuenta regresiva -->
                <ul class="date-time">
                  <li>
                    <div class="time_number" id="dias">0</div>
                    <div class="time_txt">{{cuentaRegresiva.dias}}</div>
                  </li>
                  <li>
                    <div class="time_number" id="horas">0</div>
                    <div class="time_txt">{{cuentaRegresiva.horas}}</div>
                  </li>
                  <li>
                    <div class="time_number" id="minutos">0</div>
                    <div class="time_txt">{{cuentaRegresiva.minutos}}</div>
                  </li>
                  <li>
                    <div class="time_number" id="segundos">0</div>
                    <div class="time_txt">{{cuentaRegresiva.segundos}}</div>
                  </li>
                </ul>
              </div>
            </div>
          </section>
          {{/cuentaRegresiva}}
        </div>

        <!-- 7. UBICACIONES -->
        {{#ubicaciones}}
        <section class="section-place">
          {{#ubicaciones.lugares}}
          <div class="place-card">
            {{#@primero}}<img
              class="deco-estrella"
              src="./assets/img/estrella-sheriff.svg"
              alt=""
            />{{/@primero}}
            <h2>{{titulo}}</h2>
            <p><b>{{hora}}</b> {{lugar}}</p>
            <a class="place-btn" href="{{mapa}}" target="_blank">{{boton}}</a>
          </div>
          {{/ubicaciones.lugares}}
          <!-- Cactus rosa recargado en la última tarjeta -->
          <img class="deco-cactus" src="./assets/img/cactus.png" alt="" />
        </section>
        {{/ubicaciones}}

        <!-- CALENDARIO: lo arma main.js con evento.inicio -->
        {{#calendario}}
        <section class="section-calendario" id="calendario"></section>
        {{/calendario}}

        <!-- CRONOGRAMA: línea de tiempo vertical con la hora de cada momento -->
        {{#cronograma}}
        <section class="section-cronograma">
          <h2>{{cronograma.titulo}}</h2>
          <ul class="cronograma">
            {{#cronograma.actividades}}
            <li>
              <span class="hora">{{hora}}</span
              ><span class="actividad">{{actividad}}</span>
            </li>
            {{/cronograma.actividades}}
          </ul>
        </section>
        {{/cronograma}}

        <!-- GALERÍA (después de la recepción) -->
        {{#galeria}}
        <section class="section-slider">
          <div class="slider-photo">
            <figure class="slider-track" id="sliderTrack">
              {{#galeria.fotos}}<img
                class="img"
                src="{{foto}}"
                alt="{{alt}}"
              />{{/galeria.fotos}}
            </figure>
          </div>
          <!-- Estrella de sheriff pegada en la esquina de la foto -->
          <img
            class="deco-estrella"
            src="./assets/img/estrella-sheriff.svg"
            alt=""
          />
        </section>
        {{/galeria}}

        <!-- 8 a 10. INFO, CONFIRMACIÓN Y FOOTER: un solo degradado de atardecer -->
        <div class="atardecer">
          <span class="anochecer-estrellas" aria-hidden="true"></span>
          <!-- 8. INFO ADICIONAL -->
          <section class="section-info-adicional">
            <!-- Dibujos reutilizables de vestimenta y regalos (se pintan con el color del texto) -->
            <svg class="iconos-defs" aria-hidden="true">
              <symbol id="icono-caja" viewBox="0 0 64 64">
                <rect
                  x="8"
                  y="24"
                  width="48"
                  height="34"
                  rx="3"
                  fill="currentColor"
                />
                <rect
                  x="4"
                  y="14"
                  width="56"
                  height="12"
                  rx="3"
                  fill="currentColor"
                />
                <rect
                  x="28"
                  y="14"
                  width="8"
                  height="44"
                  style="fill: var(--rosa-palo)"
                />
                <path
                  d="M32 14 C22 0 12 4 22 14 M32 14 C42 0 52 4 42 14"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="4"
                  stroke-linecap="round"
                />
              </symbol>
              <symbol id="icono-camisa" viewBox="0 0 64 64">
                <path
                  d="M22 6 L8 14 L2 26 L12 30 L16 24 V58 H48 V24 L52 30 L62 26 L56 14 L42 6 Q32 14 22 6 Z"
                  fill="currentColor"
                />
              </symbol>
              <symbol id="icono-bota" viewBox="0 0 64 64">
                <path
                  d="M18 6 H38 V34 L56 42 Q60 44 60 50 V56 H6 V32 Q6 28 10 26 L18 22 Z"
                  fill="currentColor"
                />
              </symbol>
              <symbol id="icono-sobre" viewBox="0 0 64 48">
                <rect
                  x="3"
                  y="6"
                  width="58"
                  height="38"
                  rx="4"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="4"
                />
                <path
                  d="M5 10 L32 30 L59 10"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="4"
                  stroke-linejoin="round"
                />
              </symbol>
            </svg>

            {{#vestimenta}}
            <!-- Vestimenta al atardecer: sombrero arriba, frase grande en medio y botas abajo -->
            <div class="info-block info-anochecer">
              <!-- Soga de lazo que enmarca el contenido -->
              <svg
                class="anochecer-soga"
                viewBox="0 0 400 600"
                preserveAspectRatio="none"
                aria-hidden="true"
              >
                <path
                  d="M18 600 V150 C18 50 90 22 200 22 C310 22 382 50 382 150 V600"
                />
              </svg>
              <!-- Sombrero rosa arriba, como en el cartel -->
              <div class="vestimenta-deco" aria-hidden="true">
                <img
                  class="deco-sombrero"
                  src="./assets/img/sombrero.png"
                  alt=""
                />
              </div>
              <h2>{{vestimenta.titulo}}</h2>
              <p>{{vestimenta.texto}}</p>
              <div class="codigo-frase">
                <p class="codigo-arriba">{{vestimenta.codigoArriba}}</p>
                <p class="codigo-detalle">{{vestimenta.codigoDetalle}}</p>
              </div>
              <!-- Botas rosas abajo -->
              <img
                class="deco-botas"
                src="./assets/img/botas.png"
                alt=""
                aria-hidden="true"
              />
            </div>
            {{/vestimenta}} {{#vestimenta}}{{#regalos}}
            <div class="info-separator"></div>
            {{/regalos}}{{/vestimenta}} {{#regalos}}
            <div class="info-block regalos">
              <h2>{{regalos.titulo}}</h2>
              <svg class="regalos-caja" aria-hidden="true"><use href="#icono-caja" /></svg>
              <p class="regalos-texto">{{regalos.texto}}</p>
              {{#regalos.mensaje}}<p class="regalos-mensaje">{{regalos.mensaje}}</p>{{/regalos.mensaje}}
              <a class="regalos-btn" href="{{regalos.enlace}}" target="_blank">{{regalos.boton}}</a>
            </div>
            {{/regalos}}
            <!-- Bola de paja que rueda por debajo de la mesa de regalos -->
            <div class="paja-pista" aria-hidden="true">
              <svg class="bola-paja" viewBox="0 0 60 60" aria-hidden="true">
                <g
                  fill="none"
                  stroke="#b8864b"
                  stroke-width="2.4"
                  stroke-linecap="round"
                >
                  <path d="M10 30 Q30 8 50 30 Q30 52 10 30" />
                  <path d="M30 10 Q52 30 30 50 Q8 30 30 10" />
                  <path d="M14 18 Q34 34 50 22" />
                  <path d="M12 42 Q32 26 46 40" />
                  <path d="M20 12 Q40 40 24 52" />
                </g>
                <circle
                  cx="30"
                  cy="30"
                  r="18"
                  fill="none"
                  stroke="#8a5a2b"
                  stroke-width="2"
                />
              </svg>
            </div>
          </section>

          <!-- 9. CONFIRMACIÓN (RSVP por WhatsApp; el número va en confirmacion.whatsapp) -->
          {{#confirmacion}}
          <section class="section-message">
            <p class="rsvp-frase">{{confirmacion.frase}}</p>
            <b>{{confirmacion.destacado}}</b>
            <!-- Vaca con chicle asomándose por encima del formulario -->
            <img class="rsvp-vaca" src="./assets/img/vaca.png" alt="" />
            <form class="rsvp-form">
              <h3>{{confirmacion.titulo}}</h3>
              <input
                name="nombre"
                type="text"
                placeholder="{{confirmacion.campoNombre}}"
                required
              />
              <input
                name="personas"
                type="number"
                min="1"
                placeholder="{{confirmacion.campoAsistentes}}"
                required
              />
              <textarea
                name="mensaje"
                rows="3"
                placeholder="{{confirmacion.campoMensaje}}"
              ></textarea>
              <button type="submit" class="rsvp-btn">
                {{confirmacion.boton}}
              </button>
            </form>
          </section>
          {{/confirmacion}}

          <!-- 10. FOOTER -->
          <div class="anochecer-cerca" aria-hidden="true"></div>
        <footer class="footer-mirai">
          <p class="footer-credito">
            {{footer.texto}} {{footer.marca}} {{footer.anio}} · Todos los derechos reservados
          </p>
          <p class="footer-contacto">
            Contáctanos:
            <a href="{{footer.link}}" target="_blank">Facebook</a>
            {{#confirmacion.whatsapp}}<a href="https://wa.me/{{confirmacion.whatsapp}}" target="_blank">WhatsApp</a>{{/confirmacion.whatsapp}}
            {{#footer.tiktok}}<a href="{{footer.tiktok}}" target="_blank">TikTok</a>{{/footer.tiktok}}
          </p>
        </footer>
        </div>
      </main>

      <script src="./assets/js/main.js"></script>
    </template>

    <script src="./assets/js/motor.js"></script>
  </body>
</html>
